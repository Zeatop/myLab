- name: Ajout de la clé GPG Grafana
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present

- name: Ajout du dépôt Grafana
  ansible.builtin.apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present

- name: Installation de Grafana
  ansible.builtin.apt:
    name:
      - grafana
    state: present
    update_cache: true

- name: Démarrage de Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true

- name: Attente du démarrage de Grafana
  ansible.builtin.wait_for:
    port: 3000
    delay: 5
    timeout: 60

- name: Ajout de Prometheus comme datasource
  ansible.builtin.uri:
    url: http://localhost:3000/api/datasources
    method: POST
    user: admin
    password: admin
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      name: Prometheus
      type: prometheus
      url: http://localhost:9090
      access: proxy
      isDefault: true
    status_code:
      - 200
      - 409