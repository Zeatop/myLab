- name: Installation de Kibana
  ansible.builtin.apt:
    name:
      - kibana
    state: present
    update_cache: true

- name: Configuration de Kibana pour écouter sur toutes les interfaces
  ansible.builtin.lineinfile:
    path: /etc/kibana/kibana.yml
    regexp: '^#?server.host:'
    line: 'server.host: "0.0.0.0"'

- name: Configuration de la connexion Elasticsearch
  ansible.builtin.lineinfile:
    path: /etc/kibana/kibana.yml
    regexp: '^#?elasticsearch.hosts:'
    line: 'elasticsearch.hosts: ["http://localhost:9200"]'

- name: Démarrage de Kibana
  ansible.builtin.systemd:
    name: kibana
    state: started
    enabled: true

- name: Attente du démarrage de Kibana
  ansible.builtin.wait_for:
    port: 5601
    delay: 10
    timeout: 120