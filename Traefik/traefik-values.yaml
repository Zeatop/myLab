deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:1.36
      command: ["sh", "-c", "chown 65532:65532 /data && touch /data/acme.json && chown 65532:65532 /data/acme.json && chmod 600 /data/acme.json"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: data
          mountPath: /data

nodeSelector:
  kubernetes.io/hostname: k8s-worker-2

podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: false

ports:
  web:
    port: 80
    nodePort: 30000
  websecure:
    port: 443
    nodePort: 30001

service:
  type: NodePort
  spec:
    externalTrafficPolicy: Local

additionalArguments:
  - "--certificatesresolvers.letsencrypt.acme.email=leo_jackson@hotmail.fr"
  - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
  - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
  - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

persistence:
  enabled: true
  size: 128Mi
  path: /data

ingressRoute:
  dashboard:
    enabled: true

logs:
  general:
    level: INFO
  access:
    enabled: true
