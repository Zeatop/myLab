# =============================================================================
# cloud-init.yml - Configuration au premier boot de la VM
# =============================================================================

#cloud-config

# Le hostname de la VM (injecté par Terraform via templatefile)
hostname: ${hostname}

# Création de l'utilisateur principal
users:
  - name: zeatop                    # Ton user (le même que sur le serveur)
    sudo: ALL=(ALL) NOPASSWD:ALL    # Sudo sans mot de passe (pratique pour Ansible)
    shell: /bin/bash
    groups: [sudo, docker]          # Groupes utiles
    ssh_authorized_keys:
      # Ta clé SSH publique - Ansible l'utilisera pour se connecter
      # Remplace par ta vraie clé (cat ~/.ssh/id_rsa.pub sur ton serveur)
      - ssh-rsa AAAA...ta_cle_publique_ici...

# Paquets à installer dès le premier boot
packages:
  - qemu-guest-agent    # Pour la communication avec libvirt
  - curl
  - wget
  - apt-transport-https

# Commandes à exécuter une seule fois au premier boot
runcmd:
  - systemctl enable --now qemu-guest-agent