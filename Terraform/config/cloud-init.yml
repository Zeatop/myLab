#cloud-config

hostname: ${hostname}

users:
  - name: zeatop
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo]
    ssh_authorized_keys:
      # Remplace par ta clé publique : cat ~/.ssh/id_rsa.pub
      - ${ssh_public_key}

packages:
  - qemu-guest-agent
  - curl
  - wget
  - apt-transport-https

runcmd:
  - systemctl enable --now qemu-guest-agent
